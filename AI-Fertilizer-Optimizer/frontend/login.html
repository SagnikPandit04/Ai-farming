<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    body { 
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #2e7d32, #1b5e20);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        max-width: 400px;
        width: 100%;
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="logo">AgriSmart<i class="fas fa-shield-alt"></i></h1>
                <p>Secure access to your farming portal</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn primary-btn full-width">Login</button>
            </form>
            <div id="login-message" class="login-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AgriSmart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        // Demo credentials
        if (username === "farmer" && password === "password") {

            // Save login state
            localStorage.setItem("farmshield_isLoggedIn", "true");
            localStorage.setItem(
                "farmshield_user",
                JSON.stringify({ username: username })
            );

            // Redirect to dashboard
            window.location.href = "run.html";

        } else {
            alert("Invalid username or password");
        }
    });
});
</script>

</body>
</html>
